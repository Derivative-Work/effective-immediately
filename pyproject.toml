[project]
name = "effective-immediately"
version = "0.1.0"
description = "Audio, timing and generation scripts for the Effective Immediately video"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "scipy",
    "pillow",
    "librosa",
    "soundfile",
    "torch==2.8.*",
    "torchaudio==2.8.*",
    "torchvision==0.23.*",
    "whisperx==3.8.6",
    "opencv-python-headless==4.10.*",
    "espeakng-loader>=0.2.4",
    "piper-tts>=1.8.0",
    "segment-anything==1.0",
]

[tool.uv]
package = false

# Same pins as The Distillation Job and Folks Like Us: whisperx 3.8.6 pins torch 2.8, and
# cu128 is the first build with the RTX 5090's sm_120 kernels. ComfyUI has its own venv (scripts/setup_env.sh).
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
